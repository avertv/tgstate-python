{% extends "base.html" %}

{% block title %}Требуется пароль{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="login-icon">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1>Доступ ограничен</h1>
        <p class="subtitle">Для просмотра этой страницы требуется ввести пароль</p>
        
        <form action="/pwd" method="post" class="login-form">
            <div class="form-group">
                <i class="fas fa-key form-icon"></i>
                <input type="password" name="password" id="password" placeholder="Введите пароль" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
            
            {% if request.query_params.get('error') %}
            <p class="error-message">Неверный пароль, попробуйте еще раз!</p>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
